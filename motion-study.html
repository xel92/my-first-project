<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка движения • 24 кадра/с</title>
<style>body{margin:0;background:#14252a;color:#e9e4d3;font:16px system-ui;text-align:center}canvas{width:min(100%,900px);display:block;margin:20px auto}button{padding:12px 25px;border:0;border-radius:12px;background:#e7bd78;font:inherit}p{margin:12px}</style>
<canvas width="900" height="510"></canvas><button id="replay">Повторить</button><p>Проверка связного движения головы и корпуса · 24 кадра/с</p>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const texture=new Image();texture.src='assets/dragon-sleep.png';
const W=900,H=460,COLS=32,ROWS=24;
const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*x*(x*(x*6-15)+10)};
function lift(t){return t<1?0:t<2.5?ease((t-1)/1.5):t<3?1:t<4.5?1-ease((t-3)/1.5):0}
function vertex(x,y,t){
 const up=lift(t),breath=Math.sin(t*Math.PI/2)*2.2;
 // One continuous displacement field over the whole illustration.
 // The head's influence fades through the neck into the torso.
 const head=Math.exp(-(((x-295)/185)**2+((y-240)/205)**2)*1.35);
 const ground=Math.max(0,Math.min(1,(430-y)/105));
 const chest=Math.exp(-(((x-560)/230)**2+((y-240)/190)**2));
 return [x+up*18*head*ground,y+30-up*62*head*ground-breath*chest*ground];
}
function triangle(a,b,c,A,B,C){
 const den=a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]);
 const coefficient=(v)=>[(v[0]*(b[1]-c[1])+v[1]*(c[1]-a[1])+v[2]*(a[1]-b[1]))/den,(v[0]*(c[0]-b[0])+v[1]*(a[0]-c[0])+v[2]*(b[0]-a[0]))/den,(v[0]*(b[0]*c[1]-c[0]*b[1])+v[1]*(c[0]*a[1]-a[0]*c[1])+v[2]*(a[0]*b[1]-b[0]*a[1]))/den];
 const u=coefficient([A[0],B[0],C[0]]),v=coefficient([A[1],B[1],C[1]]);
 const center=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3];
 const expand=P=>{const dx=P[0]-center[0],dy=P[1]-center[1],len=Math.hypot(dx,dy);return [P[0]+dx/len*.8,P[1]+dy/len*.8]};
 ctx.save();ctx.beginPath();ctx.moveTo(...expand(A));ctx.lineTo(...expand(B));ctx.lineTo(...expand(C));ctx.closePath();ctx.clip();ctx.transform(u[0],v[0],u[1],v[1],u[2],v[2]);ctx.drawImage(texture,0,0,W,H);ctx.restore();
}
window.renderFrame=(t)=>{
 ctx.fillStyle='#14252a';ctx.fillRect(0,0,900,510);
 for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
 const a=[i*W/COLS,j*H/ROWS],b=[(i+1)*W/COLS,j*H/ROWS],c=[(i+1)*W/COLS,(j+1)*H/ROWS],d=[i*W/COLS,(j+1)*H/ROWS];
 const A=vertex(...a,t),B=vertex(...b,t),C=vertex(...c,t),D=vertex(...d,t);
 triangle(a,b,c,A,B,C);triangle(a,c,d,A,C,D);
 }
};
let start=performance.now(),last=-1;
function loop(now){const frame=Math.floor((now-start)/1000*24)%144;if(frame!==last){renderFrame(frame/24);last=frame}window.raf=requestAnimationFrame(loop)}
window.ready=texture.decode().then(()=>{window.raf=requestAnimationFrame(loop)});
document.querySelector('#replay').onclick=()=>{start=performance.now();last=-1};
</script></html>
